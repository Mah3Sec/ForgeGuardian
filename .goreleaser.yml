version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: fgctl
    main: ./cmd/fgctl/
    binary: fgctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildTime={{.Date}}

  - id: fg-agent
    main: ./cmd/fg-agent/
    binary: fg-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildTime={{.Date}}

  - id: intel-agent
    main: ./cmd/intel-agent/
    binary: intel-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildTime={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "forgeguardian_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - signatures/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - repository:
      owner: Mah3Sec
      name: homebrew-tap
    name: forgeguardian
    homepage: https://github.com/Mah3Sec/ForgeGuardian
    description: Local-first AI-native software supply chain security platform
    license: Apache-2.0
    install: |
      bin.install "fgctl"
      bin.install "fg-agent"
      bin.install "intel-agent"
