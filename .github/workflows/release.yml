name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  packages: write

env:
  GO_VERSION: "1.25"

jobs:
  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify license secret is configured
        run: |
          if [ -z "${{ secrets.FG_LICENSE_SECRET }}" ]; then
            echo "::error::FG_LICENSE_SECRET repo secret is not set — refusing to cut a release with the public dev-build license secret baked in. Set it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Real license-signing secret, set in repo Settings > Secrets and
          # variables > Actions. Never committed. The step above already
          # hard-fails the release if it's unset — see internal/license/license.go
          # for why the public dev-build default must never ship in a real
          # release binary (it's readable in the open-source repo itself).
          FG_LICENSE_SECRET: ${{ secrets.FG_LICENSE_SECRET }}

  sign-images:
    name: Build & Sign Container Images
    runs-on: ubuntu-latest
    needs: goreleaser

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push API image
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: ./internal/api
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/forgeguardian-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/forgeguardian-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign API image (keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/forgeguardian-api@${{ steps.push-api.outputs.digest }}"

      - name: Release summary
        run: |
          {
            echo "## ForgeGuardian ${{ github.ref_name }} Released"
            echo ""
            echo "### Binaries"
            echo "- [Download](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})"
            echo ""
            echo "### Container Images"
            echo "- API:    \`ghcr.io/${{ github.repository_owner }}/forgeguardian-api:${{ github.ref_name }}\`"
            echo ""
            echo "### Install"
            echo '```bash'
            echo "curl -sSfL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
