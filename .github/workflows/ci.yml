name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"

jobs:
  # ── Go: lint + vet + test ─────────────────────────────────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./internal/... ./cmd/...

      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./cmd/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all binaries
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/fgctl/
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/fg-agent/
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/intel-agent/

  # ── TypeScript: lint + type-check + test + build ──────────────────────────
  ts-ci:
    name: TypeScript CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist

  # ── Security: Semgrep SAST ────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep --config=auto --error --json --output=semgrep.json . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.json

  # ── Docker: bake with SBOM + provenance ──────────────────────────────────
  docker-bake:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [go-build, ts-ci]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (with SBOM + provenance)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./internal/api/Dockerfile
          push: false
          sbom: true
          provenance: mode=max
          tags: forgeguardian/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

