version: "3.9"

# Full platform stack — postgres + redis + API + dashboard.
# Usage: docker compose up -d
#        Open http://localhost:3000
# Copy .env.example to .env before starting.

networks:
  forgeguardian:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ── Metadata store ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgeguardian
      POSTGRES_USER: forgeguardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/k8s/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [forgeguardian]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeguardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Job queue ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [forgeguardian]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ForgeGuardian API ───────────────────────────────────────────────────────
  forgeguardian-api:
    build:
      context: .
      dockerfile: internal/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://forgeguardian:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/forgeguardian?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    networks: [forgeguardian]
    depends_on:
      postgres:
        condition: service_healthy

  # ── Web Dashboard ──────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks: [forgeguardian]
    depends_on:
      - forgeguardian-api
