version: "3.9"

# Full platform stack — postgres + redis + ForgeGuardian (API + dashboard).
#
# Quick start (no .env needed):
#   docker compose up -d
#   open http://localhost:3000
#   Login: admin@forgeguardian.local / changeme123
#
# Custom credentials:
#   FG_ADMIN_EMAIL=you@example.com FG_ADMIN_PASSWORD=YourSecurePass docker compose up -d

networks:
  forgeguardian:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  fg_data:

services:
  # ── Metadata store ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgeguardian
      POSTGRES_USER: forgeguardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/k8s/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [forgeguardian]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeguardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Job queue ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [forgeguardian]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ForgeGuardian (API + Dashboard) ─────────────────────────────────────────
  forgeguardian:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://forgeguardian:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/forgeguardian?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FG_ADMIN_EMAIL: ${FG_ADMIN_EMAIL:-}
      FG_ADMIN_PASSWORD: ${FG_ADMIN_PASSWORD:-}
      FG_SESSION_SECRET: ${FG_SESSION_SECRET:-}
      FG_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    volumes:
      - fg_data:/data
    networks: [forgeguardian]
    depends_on:
      postgres:
        condition: service_healthy
