# DO NOT commit actual secret values. Use external-secrets operator or Vault.
# This is a template — replace <base64-encoded-value> with actual encoded values.
apiVersion: v1
kind: Secret
metadata:
  name: forgeguardian-secrets
  namespace: forgeguardian
type: Opaque
data:
  database-url:       <base64-encoded>
  redis-url:          <base64-encoded>
  anthropic-api-key:  <base64-encoded>
  minio-access-key:   <base64-encoded>
  minio-secret-key:   <base64-encoded>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeguardian-config
  namespace: forgeguardian
data:
  minio-endpoint: "minio.forgeguardian.svc.cluster.local:9000"
  rekor-url: ""
  dependency-track-url: "http://dependency-track.forgeguardian.svc.cluster.local:8081"
