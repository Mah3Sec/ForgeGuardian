apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeguardian-api
  namespace: forgeguardian
  labels:
    app: forgeguardian-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeguardian-api
  template:
    metadata:
      labels:
        app: forgeguardian-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: api
          image: ghcr.io/forgeguardian/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: forgeguardian-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: forgeguardian-secrets
                  key: redis-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: forgeguardian-secrets
                  key: anthropic-api-key
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: forgeguardian-config
                  key: minio-endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forgeguardian-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgeguardian-secrets
                  key: minio-secret-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forgeguardian-api
  namespace: forgeguardian
spec:
  selector:
    app: forgeguardian-api
  ports:
    - port: 80
      targetPort: 8080
      name: http
