apiVersion: batch/v1
kind: CronJob
metadata:
  name: intel-agent
  namespace: forgeguardian
spec:
  schedule: "0 */6 * * *"   # every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: intel-agent
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
          containers:
            - name: intel-agent
              image: ghcr.io/forgeguardian/intel-agent:latest
              imagePullPolicy: Always
              args:
                - --ecosystems=npm,pypi,go,rubygems,crates
                - --max-ossf=200
                - --store=/data/signatures.json
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              env:
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: forgeguardian-secrets
                      key: anthropic-api-key
              volumeMounts:
                - name: intel-store
                  mountPath: /data
          volumes:
            - name: intel-store
              persistentVolumeClaim:
                claimName: intel-store-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intel-store-pvc
  namespace: forgeguardian
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
