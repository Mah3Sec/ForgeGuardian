apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeguardian-dashboard
  namespace: forgeguardian
  labels:
    app: forgeguardian-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeguardian-dashboard
  template:
    metadata:
      labels:
        app: forgeguardian-dashboard
    spec:
      securityContext:
        runAsUser: 101
        runAsNonRoot: true
      containers:
        - name: nginx
          image: ghcr.io/forgeguardian/dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forgeguardian-dashboard
  namespace: forgeguardian
spec:
  selector:
    app: forgeguardian-dashboard
  ports:
    - port: 80
      targetPort: 8080
