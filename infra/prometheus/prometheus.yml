global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: forgeguardian-api
    static_configs:
      - targets: ["forgeguardian-api:8080"]
    metrics_path: /v1/metrics

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]
