id: FG-pypi-typosquat-requests
name: Typosquatting target — requests (300M+ monthly downloads)

type: typosquatting_target
ecosystem: pypi
severity: HIGH

target: requests

similar_names:
  - request
  - reqests
  - requsets
  - requets
  - requsts
  - rquests
  - reqeusts
  - requuests
  - requests2
  - requests3
  - requestss
  - requests_
  - python-requests
  - py-requests
  - requests-http
  - requestlib

description: |
  requests is the most downloaded Python package on PyPI with over 300 million monthly
  downloads. It is a universal dependency across data science, DevOps, and web development
  toolchains. Attackers frequently register single-character variants or common prefix/suffix
  patterns to intercept developers who mistype the package name in requirements.txt or
  pyproject.toml. Previously confirmed malicious typosquats include `request` and `requets`.

references:
  - https://pypi.org/project/requests/
  - https://checkmarx.com/blog/python-packages-typosquatting-attack/

author: mah3sec
tags: [typosquatting]
