id: FG-go-solarwinds-sunburst
name: SUNBURST / SolarWinds Orion — DLL backdoor build injection 2020

type: blocklisted_package
ecosystem: go
severity: CRITICAL

package: github.com/solarwinds/orion-sdk-go
version_range: ">=2020.2.0,<=2020.2.1"

description: |
  The SolarWinds Orion build system was compromised by Russian state actor COZY BEAR /
  APT29. A trojanised DLL (SolarWinds.Orion.Core.BusinessLayer.dll) was injected during
  the build process and signed with a legitimate SolarWinds certificate. The SUNBURST
  malware dormant period (12–14 days), DGA-based C2, and signed binary delivery made it
  undetectable by conventional tools. Any Go SDK or tooling distributed alongside Orion
  2020.2.0–2020.2.1 packages should be treated as potentially compromised. This is the
  canonical example of a build-system injection attack.

cve: CVE-2020-10148
references:
  - https://www.fireeye.com/blog/threat-research/2020/12/evasive-attacker-leverages-solarwinds-supply-chain-compromises.html
  - https://nvd.nist.gov/vuln/detail/CVE-2020-10148
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2020-10148

author: mah3sec
tags: [build-injection, state-actor, apt29, signed-malware, supply-chain]
