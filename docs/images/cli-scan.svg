<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520">
  <defs>
    <style>
      .term-bg { fill: #0d1117; }
      .term-bar { fill: #161b22; }
      .term-border { stroke: #30363d; stroke-width: 1; fill: none; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; }
      .prompt { fill: #58a6ff; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .cmd { fill: #c9d1d9; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .white { fill: #e6edf3; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .dim { fill: #8b949e; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .red { fill: #f85149; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; font-weight: 700; }
      .orange { fill: #d29922; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; font-weight: 700; }
      .yellow { fill: #e3b341; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .green { fill: #3fb950; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .cyan { fill: #39d353; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .blue { fill: #58a6ff; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
      .bold { font-weight: 700; }
      .small { font-size: 12px; }
      .banner { fill: #58a6ff; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; }
      .banner-dim { fill: #484f58; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; }
    </style>
  </defs>
  <!-- Window -->
  <rect class="term-bg" width="820" height="520" rx="8"/>
  <rect class="term-border" x="0.5" y="0.5" width="819" height="519" rx="8"/>
  <!-- Title bar -->
  <rect class="term-bar" width="820" height="36" rx="8"/>
  <rect class="term-bar" y="28" width="820" height="8"/>
  <circle class="dot-red" cx="20" cy="18" r="6"/>
  <circle class="dot-yellow" cx="40" cy="18" r="6"/>
  <circle class="dot-green" cx="60" cy="18" r="6"/>
  <text class="title" x="410" y="22" text-anchor="middle">Terminal</text>

  <!-- Prompt line -->
  <text class="prompt" x="20" y="64">$</text>
  <text class="cmd" x="36" y="64">fgctl scan .</text>

  <!-- Banner -->
  <text class="banner" x="20" y="92">  ForgeGuardian v3.0.0</text>
  <text class="banner-dim" x="20" y="106">  8 engines  |  223 signatures  |  9 ecosystems</text>

  <!-- Scanning line -->
  <text class="dim" x="20" y="134">Scanning project at ./  ...</text>

  <!-- Package 1 -->
  <text class="white bold" x="20" y="166">axios@1.3.4</text>
  <text class="red" x="180" y="166">[grade F</text>
  <text class="dim" x="265" y="166">-</text>
  <text class="white" x="278" y="166">19 findings]</text>
  <text class="dim" x="20" y="186">|--</text>
  <text class="red" x="50" y="186">CRITICAL</text>
  <text class="dim" x="130" y="186">CVE-2023-45857</text>
  <text class="white" x="290" y="186">Header Injection</text>
  <text class="green" x="470" y="186">fix: >= 1.12.0</text>
  <text class="dim" x="20" y="206">|--</text>
  <text class="orange" x="50" y="206">HIGH</text>
  <text class="dim" x="110" y="206">CVE-2022-1214</text>
  <text class="white" x="270" y="206">SSRF via Protocol</text>
  <text class="green" x="470" y="206">fix: >= 1.7.4</text>
  <text class="dim" x="20" y="226">|--</text>
  <text class="orange" x="50" y="226">HIGH</text>
  <text class="dim" x="110" y="226">CVE-2023-26159</text>
  <text class="white" x="290" y="226">Path Traversal</text>
  <text class="green" x="470" y="226">fix: >= 1.6.3</text>
  <text class="dim" x="20" y="246">`-- +16 more (use --verbose)</text>

  <!-- Package 2 -->
  <text class="white bold" x="20" y="278">lodash@4.17.20</text>
  <text class="orange" x="200" y="278">[grade D</text>
  <text class="dim" x="285" y="278">-</text>
  <text class="white" x="298" y="278">4 findings]</text>
  <text class="dim" x="20" y="298">|--</text>
  <text class="red" x="50" y="298">CRITICAL</text>
  <text class="dim" x="130" y="298">CVE-2021-23337</text>
  <text class="white" x="290" y="298">Command Injection</text>
  <text class="green" x="470" y="298">fix: >= 4.17.21</text>
  <text class="dim" x="20" y="318">`-- +3 more (use --verbose)</text>

  <!-- Package 3 -->
  <text class="white bold" x="20" y="350">requests@2.28.0</text>
  <text class="yellow" x="210" y="350">[grade C</text>
  <text class="dim" x="295" y="350">-</text>
  <text class="white" x="308" y="350">2 findings]</text>
  <text class="dim" x="20" y="370">|--</text>
  <text class="orange" x="50" y="370">HIGH</text>
  <text class="dim" x="110" y="370">CVE-2023-32681</text>
  <text class="white" x="290" y="370">Auth Header Leak</text>
  <text class="green" x="470" y="370">fix: >= 2.31.0</text>
  <text class="dim" x="20" y="390">`-- +1 more (use --verbose)</text>

  <!-- Summary -->
  <line x1="20" y1="415" x2="800" y2="415" stroke="#30363d" stroke-width="1"/>
  <text class="dim" x="20" y="440">Completed in</text>
  <text class="green" x="120" y="440">3.2s</text>
  <text class="dim" x="168" y="440">|</text>
  <text class="white" x="184" y="440">12 packages</text>
  <text class="dim" x="298" y="440">|</text>
  <text class="white" x="314" y="440">223 signatures</text>
  <text class="dim" x="440" y="440">|</text>
  <text class="white" x="456" y="440">8 engines</text>

  <!-- Findings summary -->
  <text class="dim" x="20" y="466">Findings:</text>
  <text class="red" x="100" y="466">4 critical</text>
  <text class="dim" x="190" y="466">|</text>
  <text class="orange" x="206" y="466">8 high</text>
  <text class="dim" x="270" y="466">|</text>
  <text class="yellow" x="286" y="466">7 medium</text>
  <text class="dim" x="374" y="466">|</text>
  <text class="blue" x="390" y="466">6 low</text>

  <!-- Exit -->
  <text class="dim" x="20" y="498">Exit code: 2 (policy breach: critical findings detected)</text>
</svg>