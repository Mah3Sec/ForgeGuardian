version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - goimports
    - misspell
    - revive
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
  settings:
    gosec:
      excludes:
        - G107
        - G109
        - G115
        - G204
        - G306
    staticcheck:
      checks: ["all", "-SA1019", "-SA4010"]
    errcheck:
      check-type-assertions: false
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: true
        - name: error-return

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
