run:
  timeout: 5m
  go: "1.23"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - noctx
    - sqlclosecheck
    - nilerr
    - exhaustive

linters-settings:
  gosec:
    excludes:
      - G115  # integer overflow (too noisy for now)
  revive:
    rules:
      - name: exported
        severity: warning
      - name: error-return
      - name: var-naming

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec]
  max-issues-per-linter: 50
  max-same-issues: 10
