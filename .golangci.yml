run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec

linters-settings:
  gosec:
    excludes:
      - G107
      - G109
      - G115
      - G204
      - G306
  staticcheck:
    checks: ["all", "-SA1019", "-SA4010"]
  errcheck:
    check-type-assertions: false
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: true
      - name: error-return

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
  max-issues-per-linter: 50
  max-same-issues: 10
