version: "2"

run:
  timeout: 5m

linters:
  default: standard
  disable:
    - errcheck
  enable:
    - misspell
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
  settings:
    gosec:
      excludes:
        - G104
        - G107
        - G109
        - G115
        - G122
        - G204
        - G301
        - G302
        - G304
        - G306
        - G703
        - G704

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
